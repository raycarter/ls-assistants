[project]
name = "bff"
version = "0.1.0"
description = "Streaming Azure OpenAI Responses API backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.12.15",
    "anyio>=4.0.0,<5",
    "azure-identity>=1.25.0",
    "fastapi>=0.116.1",
    "httpcore>=1.0.9,<2",
    "httpx>=0.28.1,<1",
    "openai>=2.0.0,<3",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
